# This configuration is intended for development purpose, it's **your** responsibility to harden it for production
# The postgresql service stores its data in /var/lib/postgresql/data/ of its Docker container: to keep it in a folder of your machine,
# add to the postgresql service:
#   volumes:
#     - <folder-of-your-machine>:/var/lib/postgresql/data/
name: jhipster
services:
  postgresql:
    image: postgres:18.6
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER=jhipster
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10
    # If you want to expose these ports outside your dev PC,
    # remove the "127.0.0.1:" prefix
    ports:
      - 127.0.0.1:5432:5432
