<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" novalidate [formRoot]="editForm">
      <h2 id="jhi-job-history-heading" data-cy="JobHistoryCreateUpdateHeading" jhiTranslate="jhipsterApp.jobHistory.home.createOrEditLabel">
        Create or edit a Job History
      </h2>

      <div>
        <jhi-alert-error />

        @if (editForm.id().value() !== '') {
          <div class="mb-3">
            <label class="form-label" for="field_id" jhiTranslate="jhipsterApp.jobHistory.id">Id</label>
            <input type="text" class="form-control" id="field_id" data-cy="id" [formField]="editForm.id" />
          </div>
        }

        <div class="mb-3">
          <label class="form-label" for="field_startDate" jhiTranslate="jhipsterApp.jobHistory.startDate">Start Date</label>
          <div class="d-flex">
            <input
              id="field_startDate"
              data-cy="startDate"
              type="datetime-local"
              class="form-control"
              [formField]="editForm.startDate"
              placeholder="YYYY-MM-DD HH:mm"
            />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_endDate" jhiTranslate="jhipsterApp.jobHistory.endDate">End Date</label>
          <div class="d-flex">
            <input
              id="field_endDate"
              data-cy="endDate"
              type="datetime-local"
              class="form-control"
              [formField]="editForm.endDate"
              placeholder="YYYY-MM-DD HH:mm"
            />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_language" jhiTranslate="jhipsterApp.jobHistory.language">Language</label>
          <select class="form-select" [formField]="editForm.language" id="field_language" data-cy="language">
            <option value="">{{ 'jhipsterApp.Language.null' | translate }}</option>
            @for (language of languageValues; track $index) {
              <option [value]="language">{{ 'jhipsterApp.Language.' + language | translate }}</option>
            }
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_job" jhiTranslate="jhipsterApp.jobHistory.job">Job</label>
          <select
            class="form-select"
            id="field_job"
            data-cy="job"
            [formField]="editForm.job"
            [jhiSelectOptions]="jobsCollection()"
            [compareWith]="compareJob"
          >
            <option value=""></option>
            @for (jobOption of jobsCollection(); track $index) {
              <option [value]="$index">{{ jobOption.id }}</option>
            }
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_department" jhiTranslate="jhipsterApp.jobHistory.department">Department</label>
          <select
            class="form-select"
            id="field_department"
            data-cy="department"
            [formField]="editForm.department"
            [jhiSelectOptions]="departmentsCollection()"
            [compareWith]="compareDepartment"
          >
            <option value=""></option>
            @for (departmentOption of departmentsCollection(); track $index) {
              <option [value]="$index">{{ departmentOption.id }}</option>
            }
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_employee" jhiTranslate="jhipsterApp.jobHistory.employee">Employee</label>
          <select
            class="form-select"
            id="field_employee"
            data-cy="employee"
            [formField]="editForm.employee"
            [jhiSelectOptions]="employeesCollection()"
            [compareWith]="compareEmployee"
          >
            <option value=""></option>
            @for (employeeOption of employeesCollection(); track $index) {
              <option [value]="$index">{{ employeeOption.id }}</option>
            }
          </select>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-info" (click)="previousState()">
          <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Back</span>
        </button>

        <button type="submit" id="save-entity" data-cy="entityCreateSaveButton" [disabled]="isSaving()" class="btn btn-primary">
          <fa-icon icon="save" />&nbsp;<span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
