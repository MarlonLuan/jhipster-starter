<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" [formRoot]="editForm">
      <h2 id="jhi-employee-heading" data-cy="EmployeeCreateUpdateHeading" jhiTranslate="jhipsterApp.employee.home.createOrEditLabel">
        Create or edit a Employee
      </h2>

      <div>
        <jhi-alert-error [formFields]="serverErrorFields" />

        @if (editForm.id().value() !== '') {
          <div class="mb-3">
            <label class="form-label" for="field_id" jhiTranslate="jhipsterApp.employee.id">Id</label>
            <input type="text" class="form-control" id="field_id" data-cy="id" [formField]="editForm.id" />
          </div>
        }

        <div class="mb-3">
          <label
            class="form-label"
            for="field_firstName"
            [ngbTooltip]="'jhipsterApp.employee.help.firstName' | translate"
            jhiTranslate="jhipsterApp.employee.firstName"
            >First Name</label
          >
          <input type="text" class="form-control" id="field_firstName" data-cy="firstName" [formField]="editForm.firstName" />
          <jhi-server-error [field]="editForm.firstName" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_lastName" jhiTranslate="jhipsterApp.employee.lastName">Last Name</label>
          <input type="text" class="form-control" id="field_lastName" data-cy="lastName" [formField]="editForm.lastName" />
          <jhi-server-error [field]="editForm.lastName" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_email" jhiTranslate="jhipsterApp.employee.email">Email</label>
          <input type="text" class="form-control" id="field_email" data-cy="email" [formField]="editForm.email" />
          <jhi-server-error [field]="editForm.email" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_phoneNumber" jhiTranslate="jhipsterApp.employee.phoneNumber">Phone Number</label>
          <input type="text" class="form-control" id="field_phoneNumber" data-cy="phoneNumber" [formField]="editForm.phoneNumber" />
          <jhi-server-error [field]="editForm.phoneNumber" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_hireDate" jhiTranslate="jhipsterApp.employee.hireDate">Hire Date</label>
          <div class="d-flex">
            <input
              id="field_hireDate"
              data-cy="hireDate"
              type="datetime-local"
              class="form-control"
              [formField]="editForm.hireDate"
              placeholder="YYYY-MM-DD HH:mm"
            />
          </div>
          <jhi-server-error [field]="editForm.hireDate" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_salary" jhiTranslate="jhipsterApp.employee.salary">Salary</label>
          <input type="number" class="form-control" id="field_salary" data-cy="salary" [formField]="editForm.salary" />
          <jhi-server-error [field]="editForm.salary" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_commissionPct" jhiTranslate="jhipsterApp.employee.commissionPct">Commission Pct</label>
          <input type="number" class="form-control" id="field_commissionPct" data-cy="commissionPct" [formField]="editForm.commissionPct" />
          <jhi-server-error [field]="editForm.commissionPct" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_manager" jhiTranslate="jhipsterApp.employee.manager">Manager</label>
          <select
            class="form-select"
            id="field_manager"
            data-cy="manager"
            [formField]="editForm.manager"
            [jhiSelectOptions]="employeesSharedCollection()"
            [compareWith]="compareEmployee"
          >
            <option value=""></option>
            @for (employeeOption of employeesSharedCollection(); track $index) {
              <option [value]="$index">{{ employeeOption.id }}</option>
            }
          </select>
        </div>
        <jhi-server-error [field]="editForm.manager" />

        <div class="mb-3">
          <label class="form-label" for="field_department" jhiTranslate="jhipsterApp.employee.department">Department</label>
          <select
            class="form-select"
            id="field_department"
            data-cy="department"
            [formField]="editForm.department"
            [jhiSelectOptions]="departmentsSharedCollection()"
            [compareWith]="compareDepartment"
          >
            <option value=""></option>
            @for (departmentOption of departmentsSharedCollection(); track $index) {
              <option [value]="$index">{{ departmentOption.id }}</option>
            }
          </select>
        </div>
        <jhi-server-error [field]="editForm.department" />
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-info" (click)="previousState()">
          <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Back</span>
        </button>

        <button type="submit" id="save-entity" data-cy="entityCreateSaveButton" [disabled]="isSaving()" class="btn btn-primary">
          <fa-icon icon="floppy-disk" />&nbsp;<span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
