<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" novalidate [formRoot]="editForm">
      <h2 id="jhi-region-heading" data-cy="RegionCreateUpdateHeading" jhiTranslate="jhipsterApp.region.home.createOrEditLabel">
        Create or edit a Region
      </h2>

      <div>
        <jhi-alert-error />

        @if (editForm.id().value() !== '') {
          <div class="mb-3">
            <label class="form-label" for="field_id" jhiTranslate="jhipsterApp.region.id">Id</label>
            <input type="text" class="form-control" id="field_id" data-cy="id" [formField]="editForm.id" />
          </div>
        }

        <div class="mb-3">
          <label class="form-label" for="field_regionName" jhiTranslate="jhipsterApp.region.regionName">Region Name</label>
          <input type="text" class="form-control" id="field_regionName" data-cy="regionName" [formField]="editForm.regionName" />
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-info" (click)="previousState()">
          <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Back</span>
        </button>

        <button type="submit" id="save-entity" data-cy="entityCreateSaveButton" [disabled]="isSaving()" class="btn btn-primary">
          <fa-icon icon="save" />&nbsp;<span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
