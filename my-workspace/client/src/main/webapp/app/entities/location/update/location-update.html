<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" [formRoot]="editForm">
      <h2 id="jhi-location-heading" data-cy="LocationCreateUpdateHeading" jhiTranslate="jhipsterApp.location.home.createOrEditLabel">
        Create or edit a Location
      </h2>

      <div>
        <jhi-alert-error [formFields]="serverErrorFields" />

        @if (editForm.id().value() !== '') {
          <div class="mb-3">
            <label class="form-label" for="field_id" jhiTranslate="jhipsterApp.location.id">Id</label>
            <input type="text" class="form-control" id="field_id" data-cy="id" [formField]="editForm.id" />
          </div>
        }

        <div class="mb-3">
          <label class="form-label" for="field_streetAddress" jhiTranslate="jhipsterApp.location.streetAddress">Street Address</label>
          <input type="text" class="form-control" id="field_streetAddress" data-cy="streetAddress" [formField]="editForm.streetAddress" />
          <jhi-server-error [field]="editForm.streetAddress" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_postalCode" jhiTranslate="jhipsterApp.location.postalCode">Postal Code</label>
          <input type="text" class="form-control" id="field_postalCode" data-cy="postalCode" [formField]="editForm.postalCode" />
          <jhi-server-error [field]="editForm.postalCode" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_city" jhiTranslate="jhipsterApp.location.city">City</label>
          <input type="text" class="form-control" id="field_city" data-cy="city" [formField]="editForm.city" />
          <jhi-server-error [field]="editForm.city" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_stateProvince" jhiTranslate="jhipsterApp.location.stateProvince">State Province</label>
          <input type="text" class="form-control" id="field_stateProvince" data-cy="stateProvince" [formField]="editForm.stateProvince" />
          <jhi-server-error [field]="editForm.stateProvince" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_country" jhiTranslate="jhipsterApp.location.country">Country</label>
          <select
            class="form-select"
            id="field_country"
            data-cy="country"
            [formField]="editForm.country"
            [jhiSelectOptions]="countriesSharedCollection()"
            [compareWith]="compareCountry"
          >
            <option value=""></option>
            @for (countryOption of countriesSharedCollection(); track $index) {
              <option [value]="$index">{{ countryOption.id }}</option>
            }
          </select>
        </div>
        <jhi-server-error [field]="editForm.country" />
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-info" (click)="previousState()">
          <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Back</span>
        </button>

        <button type="submit" id="save-entity" data-cy="entityCreateSaveButton" [disabled]="isSaving()" class="btn btn-primary">
          <fa-icon icon="floppy-disk" />&nbsp;<span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
