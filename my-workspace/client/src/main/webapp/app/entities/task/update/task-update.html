<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" [formRoot]="editForm">
      <h2 id="jhi-task-heading" data-cy="TaskCreateUpdateHeading" jhiTranslate="jhipsterApp.task.home.createOrEditLabel">
        Create or edit a Task
      </h2>

      <div>
        <jhi-alert-error [formFields]="serverErrorFields" />

        @if (editForm.id().value() !== '') {
          <div class="mb-3">
            <label class="form-label" for="field_id" jhiTranslate="jhipsterApp.task.id">Id</label>
            <input type="text" class="form-control" id="field_id" data-cy="id" [formField]="editForm.id" />
          </div>
        }

        <div class="mb-3">
          <label class="form-label" for="field_title" jhiTranslate="jhipsterApp.task.title">Title</label>
          <input type="text" class="form-control" id="field_title" data-cy="title" [formField]="editForm.title" />
          <jhi-server-error [field]="editForm.title" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_description" jhiTranslate="jhipsterApp.task.description">Description</label>
          <input type="text" class="form-control" id="field_description" data-cy="description" [formField]="editForm.description" />
          <jhi-server-error [field]="editForm.description" />
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-info" (click)="previousState()">
          <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Back</span>
        </button>

        <button type="submit" id="save-entity" data-cy="entityCreateSaveButton" [disabled]="isSaving()" class="btn btn-primary">
          <fa-icon icon="floppy-disk" />&nbsp;<span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
