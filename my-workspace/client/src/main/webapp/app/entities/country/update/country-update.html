<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" [formRoot]="editForm">
      <h2 id="jhi-country-heading" data-cy="CountryCreateUpdateHeading" jhiTranslate="jhipsterApp.country.home.createOrEditLabel">
        Create or edit a Country
      </h2>

      <div>
        <jhi-alert-error [formFields]="serverErrorFields" />

        @if (editForm.id().value() !== '') {
          <div class="mb-3">
            <label class="form-label" for="field_id" jhiTranslate="jhipsterApp.country.id">Id</label>
            <input type="text" class="form-control" id="field_id" data-cy="id" [formField]="editForm.id" />
          </div>
        }

        <div class="mb-3">
          <label class="form-label" for="field_countryName" jhiTranslate="jhipsterApp.country.countryName">Country Name</label>
          <input type="text" class="form-control" id="field_countryName" data-cy="countryName" [formField]="editForm.countryName" />
          <jhi-server-error [field]="editForm.countryName" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_region" jhiTranslate="jhipsterApp.country.region">Region</label>
          <select
            class="form-select"
            id="field_region"
            data-cy="region"
            [formField]="editForm.region"
            [jhiSelectOptions]="regionsSharedCollection()"
            [compareWith]="compareRegion"
          >
            <option value=""></option>
            @for (regionOption of regionsSharedCollection(); track $index) {
              <option [value]="$index">{{ regionOption.id }}</option>
            }
          </select>
        </div>
        <jhi-server-error [field]="editForm.region" />
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-info" (click)="previousState()">
          <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Back</span>
        </button>

        <button type="submit" id="save-entity" data-cy="entityCreateSaveButton" [disabled]="isSaving()" class="btn btn-primary">
          <fa-icon icon="floppy-disk" />&nbsp;<span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
