@defer (when loggers() && !isLoading()) {
  <div class="table-responsive">
    <h2 id="logs-page-heading" data-cy="logsPageHeading" jhiTranslate="logs.title">Logs</h2>

    <p jhiTranslate="logs.nbloggers" [translateValues]="{ total: loggers()?.length }">There are {{ loggers()?.length }} loggers.</p>

    <label for="logs-filter" jhiTranslate="logs.filter">Filter</label>
    <input #filterInput id="logs-filter" type="text" [value]="filter()" (input)="filter.set(filterInput.value)" class="form-control" />

    <table class="table table-sm table-striped table-bordered" aria-describedby="logs-page-heading">
      <thead>
        <tr jhiSort [sortState]="sortState()" (sortStateChange)="sortState.set($event)">
          <th jhiSortBy="name" scope="col"><span jhiTranslate="logs.table.name">Name</span> <fa-icon icon="sort" /></th>
          <th jhiSortBy="level" scope="col"><span jhiTranslate="logs.table.level">Level</span> <fa-icon icon="sort" /></th>
        </tr>
      </thead>

      <tbody>
        @for (logger of filteredAndOrderedLoggers(); track logger.name) {
          <tr>
            <td>
              <small>{{ logger.name | slice: 0 : 140 }}</small>
            </td>
            <td>
              @for (level of levels; track level.name) {
                <button
                  (click)="changeLevel(logger.name, level.name)"
                  [class]="logger.level === level.name ? level.activeClass : 'btn-light'"
                  class="btn btn-sm"
                >
                  {{ level.name }}
                </button>
              }
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
} @loading {
  <div class="d-flex justify-content-center me-3">
    <div class="spinner-border"></div>
  </div>
}
